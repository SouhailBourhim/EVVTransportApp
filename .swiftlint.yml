# SwiftLint Configuration for EVV Transport App
# This file defines code style rules for consistent, clean Swift code

# Directories to include in linting
included:
  - EVVTransportApp
  - EVVTransportAppTests
  - EVVTransportAppUITests

# Directories to exclude from linting
excluded:
  - Carthage
  - Pods
  - .build
  - DerivedData

# Disable rules that might be too strict for this project
disabled_rules:
  - trailing_whitespace # Allow some flexibility with whitespace
  - todo # Allow TODO comments during development

# Configure specific rules
line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 50
  error: 100

file_length:
  warning: 400
  error: 500

type_body_length:
  warning: 200
  error: 300

# Opt-in rules (additional quality checks)
opt_in_rules:
  - empty_count
  - empty_string
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - redundant_nil_coalescing
  - unused_import
  - vertical_whitespace_closing_braces

# Custom rules for better code quality
custom_rules:
  # Ensure proper spacing around operators
  operator_usage_whitespace:
    name: "Operator Usage Whitespace"
    regex: '(?:\+|-|\*|/|%|=|!|<|>|&|\||\^|~|\?|:)(?:\S)'
    message: "Operators should be surrounded by whitespace"
    severity: warning

# Reporter type (how violations are displayed)
reporter: "xcode" # Use Xcode-compatible format