# GitHub Actions Workflow for EVV Transport App
# This file tells GitHub what to do automatically

name: iOS CI/CD Pipeline

# When should this run?
on:
  push:
    branches: [ main ]        # Run when code is pushed to main branch
  pull_request:
    branches: [ main ]        # Run when someone creates a pull request

# What jobs should run?
jobs:
  test:
    name: Run Tests
    runs-on: macos-latest     # Use a Mac computer (required for iOS)
    
    steps:
    # Step 1: Get the code
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Step 2: Set up Xcode
    - name: Select Xcode version
      run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
    
    # Step 3: Show Xcode version (for debugging)
    - name: Show Xcode version
      run: xcodebuild -version
    
    # Step 4: Run unit tests
    - name: Run Unit Tests
      run: |
        xcodebuild test \
          -scheme EVVTransportApp \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          -only-testing:EVVTransportAppTests \
          -enableCodeCoverage YES
    
    # Step 5: Run UI tests (if project config is fixed)
    - name: Run UI Tests
      run: |
        xcodebuild test \
          -scheme EVVTransportApp \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          -only-testing:EVVTransportAppUITests
      continue-on-error: true  # Don't fail if UI tests have config issues
    
    # Step 6: Build the app
    - name: Build App
      run: |
        xcodebuild build \
          -scheme EVVTransportApp \
          -destination 'platform=iOS Simulator,name=iPhone 16'

  # Optional: Code quality checks
  code-quality:
    name: Code Quality
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Check for common Swift issues
    - name: Install SwiftLint
      run: brew install swiftlint
    
    - name: Run SwiftLint
      run: swiftlint --strict
      continue-on-error: true  # Don't fail build for style issues